name: Upgrade BPDI Platform OS to V3

on:
  push:
    branches: [main]
    paths:
      - "scripts/upgrade_v3.py"
      - ".github/workflows/upgrade-v3.yml"

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply V3 migration
        run: python3 scripts/upgrade_v3.py

      - name: Validate V3 markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path('index.html').read_text(encoding='utf-8')
          required=[
            'Versão 3.0.0',
            'id="bpdi-v3-overlay"',
            'ATUALIZAÇÃO CANÔNICA V3 — AGOSTO DE 2026',
            'SINAIS EXTERNOS · AGOSTO 2026',
            'BPDI PlatformCo / BPI',
            'bpdi_decisions_v3',
          ]
          missing=[x for x in required if x not in h]
          if missing:
              raise SystemExit(f'Marcadores V3 ausentes: {missing}')
          if h.count('id="bpdi-v3-overlay"') != 1:
              raise SystemExit('Overlay V3 duplicado')
          assert Path('archive/BPDI_Platform_OS_V2_0_0_2026-06-25.html').exists()
          assert Path('docs/BPDI_V3_AUDIT.md').exists()
          print('Validação V3 OK')
          PY

      - name: Commit generated V3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html archive/BPDI_Platform_OS_V2_0_0_2026-06-25.html docs/BPDI_V3_AUDIT.md
          if git diff --cached --quiet; then
            echo "Nenhuma alteração gerada"
            exit 0
          fi
          git commit -m "feat: BPDI Platform OS v3.0.0 — agosto 2026"
          git push origin main

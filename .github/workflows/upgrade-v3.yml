name: Upgrade BPDI Platform OS to V3

on:
  push:
    branches: [main]
    paths:
      - "scripts/upgrade_v3.py"
      - "scripts/fix_runtime_v3.py"
      - ".github/workflows/upgrade-v3.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair V3.0.1 runtime
        run: python3 scripts/fix_runtime_v3.py

      - name: Validate JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',h,re.S)
          Path('/tmp/bpdi-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/bpdi-inline.js

      - name: Validate V3.0.1 markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path('index.html').read_text(encoding='utf-8')
          required=[
            'Versão 3.0.1',
            'id="bpdi-v3-overlay"',
            'ATUALIZAÇÃO CANÔNICA V3 — AGOSTO DE 2026',
            'SINAIS EXTERNOS · AGOSTO 2026',
            'BPDI PlatformCo / BPI',
            'bpdi_decisions_v3',
            'Gate and boot — V3.0.1',
            'A seção ATUALIZAÇÃO CANÔNICA V3 prevalece',
          ]
          missing=[x for x in required if x not in h]
          if missing:
              raise SystemExit(f'Marcadores ausentes: {missing}')
          print('Validação V3.0.1 OK')
          PY

      - name: Commit repaired V3.0.1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração gerada"
            exit 0
          fi
          git commit -m "fix: BPDI Platform OS v3.0.1 runtime and access gate"
          git push origin main
